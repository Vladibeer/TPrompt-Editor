<!-- ==================== НАЧАЛО: Прозорец „Пусни“ (начин на стартиране) ==================== -->
<div id="startModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="stTitle">
  <div class="modal-card ex-card">
    <header><b id="stTitle"><i data-ic="play"></i><span>Start mode</span></b><button class="ib" id="stClose" type="button" title="Close"><i data-ic="x"></i></button></header>
    <div class="modal-body opts">
      <p class="st-note" id="stNote" hidden></p>
      <button class="opt" id="bStart" type="button" title="Start in full screen (Ctrl+Enter)"><i data-ic="max"></i><span><span id="bStartT">Full screen</span><small id="bStartS">on this device</small></span></button>
      <button class="opt" id="bWin" type="button"><i data-ic="wins"></i><span><span id="bWinT">In a window</span><small id="bWinS">on this device</small></span></button>
      <button class="opt" id="rmShow" type="button" disabled><i data-ic="swap"></i><span><span id="rmShowT">Full screen</span><small id="rmShowS">on the connected device</small></span></button>
      <label class="st-rem sw2"><span class="st-rem-t">Remember my choice (can be changed in Settings)</span><input type="checkbox" id="stRemember"><span class="tr"></span></label>
    </div>
  </div>
</div>
<!-- ==================== КРАЙ: Прозорец „Пусни“ (начин на стартиране) ==================== -->
