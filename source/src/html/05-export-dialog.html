<!-- ==================== НАЧАЛО: Прозорец „Експортирай“ ==================== -->
<div id="saveAsModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="saTitle">
  <div class="modal-card ex-card">
    <header><b id="saTitle"><i data-ic="floppy"></i><span>Export</span></b><button class="ib" id="saClose" type="button" title="Close"><i data-ic="x"></i></button></header>
    <div class="modal-body opts">
      <div class="ex-sec">This text</div>
      <button class="opt" data-save="docx" type="button"><b class="ex-ext">DOCX</b><span>Word document<small>Editable in Word, LibreOffice, Google Docs</small></span></button>
      <button class="opt" data-save="odt" type="button"><b class="ex-ext">ODT</b><span>OpenDocument document<small>For LibreOffice, OnlyOffice and Word</small></span></button>
      <button class="opt" data-save="rtf" type="button"><b class="ex-ext">RTF</b><span>RTF document<small>Older format for Word and other editors</small></span></button>
      <button class="opt" data-save="txt" type="button"><b class="ex-ext">TXT</b><span>Plain text<small>No formatting</small></span></button>
      <div class="ex-sec">All texts</div>
      <button class="opt" data-save="all" type="button"><b class="ex-ext">JSON</b><span>List of texts<small>All texts with bookmarks and settings in one file</small></span></button>
    </div>
  </div>
</div>
<!-- ==================== КРАЙ: Прозорец „Експортирай“ ==================== -->
